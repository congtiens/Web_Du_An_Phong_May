<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Thiết bị - Đồ án IT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card-header { background-color: #0d6efd; color: white; font-weight: bold; }
        /* Badge trạng thái */
        .badge-tot { background-color: #198754; } /* Xanh lá */
        .badge-hong { background-color: #dc3545; } /* Đỏ */
    </style>
</head>
<body>

<div class="container">
    <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="fa-solid fa-computer"></i> QUẢN LÝ THIẾT BỊ</span>
            <button class="btn btn-light btn-sm text-primary fw-bold" data-bs-toggle="modal" data-bs-target="#modalThietBi">
                <i class="fa-solid fa-plus"></i> Thêm mới
            </button>
        </div>
        
        <div class="card-body">
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fa-solid fa-search"></i></span>
                <input type="text" class="form-control" id="search" placeholder="Nhập tên hoặc mã máy để tìm...">
            </div>

            <table class="table table-bordered table-hover text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Mã máy</th>
                        <th>Tên thiết bị</th>
                        <th>Cấu hình</th>
                        <th>Phòng</th>
                        <th>Loại</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="tbHienThi">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalThietBi">
    <div class="modal-dialog modal-lg"> <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Thông tin thiết bị</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="idThietBi"> 
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mã thiết bị</label>
                        <input type="text" id="maTB" class="form-control" placeholder="VD: PC-01">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tên thiết bị</label>
                        <input type="text" id="tenTB" class="form-control" placeholder="VD: Dell Optiplex">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cấu hình / Thông số</label>
                    <textarea id="thongSo" class="form-control" rows="2"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Phòng (ID)</label>
                        <input type="number" id="idPhong" class="form-control" placeholder="Nhập ID phòng">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Loại (ID)</label>
                        <input type="number" id="idLoai" class="form-control" placeholder="Nhập ID loại">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Trạng thái</label>
                        <select id="trangThai" class="form-select">
                            <option value="Tot">Hoạt động tốt</option>
                            <option value="Hong">Đang hỏng</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-primary" id="btnSave">Lưu dữ liệu</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function () {
    
    // 1. Load dữ liệu khi vào trang
    loadData();

    function loadData() {
        $.post("api_thiet_bi.php", { action: "fetch" }, function (data) {
            let rows = "";
            try {
                let json = JSON.parse(data);
                $.each(json, function (i, v) {
                    // Xử lý màu trạng thái
                    let badgeClass = (v.trang_thai == 'Tot') ? 'badge-tot' : 'badge-hong';
                    let textTT = (v.trang_thai == 'Tot') ? 'Tốt' : 'Hỏng';

                    rows += `
                    <tr>
                        <td>${v.id_thiet_bi}</td>
                        <td class="fw-bold text-primary">${v.ma_thiet_bi}</td>
                        <td>${v.ten_thiet_bi}</td>
                        <td class="text-start"><small>${v.thong_so_ky_thuat}</small></td>
                        <td>${v.id_phong}</td>
                        <td>${v.id_loai}</td>
                        <td><span class="badge ${badgeClass}">${textTT}</span></td>
                        <td>
                            <button class="btn btn-warning btn-sm btnEdit"
                                data-id="${v.id_thiet_bi}"
                                data-ma="${v.ma_thiet_bi}"
                                data-ten="${v.ten_thiet_bi}"
                                data-ts="${v.thong_so_ky_thuat}"
                                data-phong="${v.id_phong}"
                                data-loai="${v.id_loai}"
                                data-tt="${v.trang_thai}">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button class="btn btn-danger btn-sm btnDelete" data-id="${v.id_thiet_bi}">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>`;
                });
            } catch (e) {
                console.log("Lỗi JSON:", e);
            }
            $("#tbHienThi").html(rows);
        });
    }

    // 2. Xử lý nút LƯU (Thêm mới hoặc Cập nhật)
    $("#btnSave").click(function () {
        let id = $("#idThietBi").val();
        let action = id ? "update" : "insert"; // Có ID là sửa, không có là thêm

        $.post("api_thiet_bi.php", {
            action: action,
            id: id,
            ma: $("#maTB").val(),
            ten: $("#tenTB").val(),
            thongSo: $("#thongSo").val(),
            idPhong: $("#idPhong").val(),
            idLoai: $("#idLoai").val(),
            trangThai: $("#trangThai").val()
        }, function (res) {
            // Có thể thêm check if(res == true) để báo thành công
            $("#modalThietBi").modal("hide");
            resetForm();
            loadData(); // Tải lại bảng
        });
    });

    // 3. Xử lý nút SỬA (Đẩy dữ liệu lên Form)
    $(document).on("click", ".btnEdit", function () {
        let btn = $(this);
        $("#idThietBi").val(btn.data("id"));
        $("#maTB").val(btn.data("ma"));
        $("#tenTB").val(btn.data("ten"));
        $("#thongSo").val(btn.data("ts"));
        $("#idPhong").val(btn.data("phong"));
        $("#idLoai").val(btn.data("loai"));
        $("#trangThai").val(btn.data("tt"));

        $("#modalThietBi").modal("show");
    });

    // 4. Xử lý nút XÓA
    $(document).on("click", ".btnDelete", function () {
        if (confirm("Cảnh báo: Bạn có chắc chắn muốn xóa thiết bị này?")) {
            $.post("api_thiet_bi.php", {
                action: "delete",
                id: $(this).data("id")
            }, function () {
                loadData();
            });
        }
    });

    // 5. Reset form khi đóng modal hoặc thêm mới
    $('#modalThietBi').on('hidden.bs.modal', function () {
        resetForm();
    });

    function resetForm() {
        $("#idThietBi").val("");
        $("#maTB").val("");
        $("#tenTB").val("");
        $("#thongSo").val("");
        $("#idPhong").val("");
        $("#idLoai").val("");
        $("#trangThai").val("Tot");
    }

    // 6. Tìm kiếm nhanh
    $("#search").on("keyup", function () {
        let value = $(this).val().toLowerCase();
        $("#tbHienThi tr").filter(function () {
            $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
        });
    });

});
</script>
</body>
</html>

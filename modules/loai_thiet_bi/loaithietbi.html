<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Loại thiết bị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body { background: #f8f9fa; }
        .card { border-radius: 12px; }
        .table th { background: #0d6efd; color: white; }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">📁 Quản lý Loại thiết bị</h5>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalLoai">
                ➕ Thêm loại thiết bị
            </button>
        </div>

        <div class="card-body">
            <input type="text" id="search" class="form-control mb-3" placeholder="🔍 Tìm theo tên loại (PC, Chuột...)">

            <table class="table table-bordered table-hover text-center align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Tên loại thiết bị</th>
                    <th>Mô tả</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody id="loaiTable"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalLoai">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Loại thiết bị</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="idLoai">
                <div class="mb-3">
                    <label class="form-label">Tên loại thiết bị</label>
                    <input type="text" id="tenLoai" class="form-control" placeholder="Ví dụ: Màn hình">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea id="moTa" class="form-control" placeholder="Mô tả chi tiết loại"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button class="btn btn-success" id="btnSave">Lưu</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function () {

    // Gọi hàm load dữ liệu ngay khi mở trang
    loadData();

    // Hàm tải danh sách từ Server
    function loadData() {
        $.post("api_loai_thiet_bi.php", { action: "fetch" }, function (data) {
            let rows = "";
            try {
                // Parse JSON và duyệt qua dữ liệu
                $.each(JSON.parse(data), function (i, v) {
                    rows += `
                    <tr>
                        <td>${v.id_loai}</td> 
                        <td>${v.ten_loai}</td>
                        <td>${v.mo_ta}</td>
                        <td>
                            <button class="btn btn-warning btn-sm btnEdit"
                                data-id="${v.id_loai}"
                                data-ten="${v.ten_loai}"
                                data-mota="${v.mo_ta}">Sửa</button>
                            <button class="btn btn-danger btn-sm btnDelete"
                                data-id="${v.id_loai}">Xóa</button>
                        </td>
                    </tr>`;
                });
            } catch (e) {
                console.log("Lỗi tải dữ liệu: ", e);
            }
            // Đổ dữ liệu vào bảng
            $("#loaiTable").html(rows);
        });
    }

    /* NÚT LƯU (THÊM / SỬA) */
    $("#btnSave").click(function () {
        let id = $("#idLoai").val();
        let action = id ? "update" : "insert";

        $.post("api_loai_thiet_bi.php", {
            action: action,
            id: id,
            ten: $("#tenLoai").val(),
            moTa: $("#moTa").val()
        }, function (response) {
            $("#modalLoai").modal("hide");
            $("#idLoai").val("");
            $("#tenLoai").val("");
            $("#moTa").val("");
            loadData(); // Tải lại bảng sau khi lưu
        });
    });

    /* NÚT SỬA (Đổ dữ liệu lên Modal) */
    $(document).on("click", ".btnEdit", function () {
        $("#idLoai").val($(this).data("id"));
        $("#tenLoai").val($(this).data("ten"));
        $("#moTa").val($(this).data("mota"));
        $("#modalLoai").modal("show");
    });

    /* NÚT XÓA */
    $(document).on("click", ".btnDelete", function () {
        if (confirm("Bạn có chắc muốn xóa loại này không?")) {
            $.post("api_loai_thiet_bi.php", {
                action: "delete",
                id: $(this).data("id")
            }, function () {
                loadData();
            });
        }
    });

    /* TÌM KIẾM */
    $("#search").on("keyup", function () {
        let value = $(this).val().toLowerCase();
        $("#loaiTable tr").filter(function () {
            $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
        });
    });

});
</script>
</body>
</html>
